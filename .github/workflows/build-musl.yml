name: Build uni-api musl binary (amd64)

# 手动触发，或改动源码时自动跑。编译完成后发布到本仓库的 Release。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-musl.yml'

# 发布 Release 需要写权限。
# 注意：fork 仓库首次使用前，需在 Settings → Actions → General →
# Workflow permissions 里选择 "Read and write permissions"，否则发布会被拒绝。
permissions:
  contents: write

jobs:
  build-musl-amd64:
    name: x86_64-unknown-linux-musl (Alpine native)
    runs-on: ubuntu-latest

    # Alpine 容器 = 原生 musl 环境，避免交叉编译 C 依赖（ring/zstd/rusqlite）的坑
    container:
      image: rust:1.84-alpine3.21

    steps:
      - name: Install build deps
        run: |
          apk add --no-cache \
            musl-dev gcc make perl \
            binutils file \
            git nodejs \
            curl jq \
            ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          echo "host target: $(rustc -vV | grep host)"

      # 注意：不要在 Alpine 上加 RUSTFLAGS=-C target-feature=+crt-static。
      # 那会让 proc-macro（编译期 .so）也尝试静态链接而报错：
      #   cannot produce proc-macro for `async-trait` as the target does not support these crate types
      # Alpine 的 host target 本来就是 x86_64-unknown-linux-musl，直接编译即产出 musl 二进制。
      - name: Build
        run: |
          cargo build --release --locked
          strip target/release/uni-api-front || true
          echo "=== 产物 ==="
          ls -lh target/release/uni-api-front

      - name: Verify musl linkage
        run: |
          file target/release/uni-api-front || true
          echo "--- 依赖库（应指向 libc.musl-x86_64.so.1，或显示 statically linked）---"
          ldd target/release/uni-api-front 2>&1 || true

      - name: Smoke test (non-blocking)
        continue-on-error: true
        run: |
          cd "$GITHUB_WORKSPACE"
          cat > api.yaml <<'EOF'
          providers:
            - provider: custom
              base_url: https://example.com/v1
              api: dummy
              model:
                - dummy-model
          api_keys:
            - api: test-key
          EOF
          ./target/release/uni-api-front &
          PID=$!
          sleep 6
          curl -sS -m 5 -o /dev/null -w "health_http=%{http_code}\n" http://127.0.0.1:8000/ || true
          kill $PID 2>/dev/null || true
          rm -f api.yaml

      # 版本号跟随上游 yym68686/uni-api 的 latest release tag（形如 v1.7.276）
      - name: Resolve upstream latest tag
        id: upstream
        run: |
          TAG=$(curl -sS -m 20 -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/yym68686/uni-api/releases/latest" | jq -r '.tag_name // empty')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::无法获取上游 latest 版本号"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "上游 latest: $TAG"

      - name: Package (fixed filename + sha256)
        id: pack
        run: |
          # 文件名固定不带版本号 —— 客户端可用永久地址：
          #   https://github.com/<owner>/<repo>/releases/latest/download/uni-api-linux-x86_64-musl
          NAME="uni-api-linux-x86_64-musl"
          cp target/release/uni-api-front "$NAME"
          chmod +x "$NAME"
          sha256sum "$NAME" > "${NAME}.sha256"
          ls -lh "$NAME" "${NAME}.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.upstream.outputs.tag }}
          name: ${{ steps.upstream.outputs.tag }} (musl x86_64)
          body: |
            Alpine / musl static build of the **uni-api core** (`uni-api-front`).

            - Upstream version: `${{ steps.upstream.outputs.tag }}`
            - Target: `x86_64-unknown-linux-musl`
            - Built from commit: `${{ github.sha }}`
            - Runs on any x86_64 Linux (Alpine, Debian, Ubuntu) — statically linked
            - Config: place `api.yaml` next to the binary, then run it

            **固定下载地址（永远指向最新版，客户端不用改）：**
            ```
            https://github.com/${{ github.repository }}/releases/latest/download/${{ steps.pack.outputs.name }}
            ```

            Verify: `sha256sum -c ${{ steps.pack.outputs.name }}.sha256`
          files: |
            ${{ steps.pack.outputs.name }}
            ${{ steps.pack.outputs.name }}.sha256
          overwrite_files: true
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: uni-api-front-linux-amd64-musl
          path: target/release/uni-api-front
          if-no-files-found: error
          retention-days: 30
