name: Build uni-api musl binary (amd64)

# 只保留手动触发，避免意外运行。
on:
  workflow_dispatch:

# 发布 Release 需要写权限。
# fork 仓库首次使用前，需在 Settings → Actions → General →
# Workflow permissions 里选择 "Read and write permissions"。
permissions:
  contents: write

jobs:
  build-musl-amd64:
    name: x86_64-unknown-linux-musl (Alpine native)
    runs-on: ubuntu-latest

    # Alpine 容器 = 原生 musl 环境，避免交叉编译 C 依赖（ring/zstd/rusqlite）的坑
    container:
      image: rust:1.84-alpine3.21

    steps:
      - name: Install build deps
        run: |
          apk add --no-cache \
            musl-dev gcc make perl \
            binutils file \
            git nodejs \
            curl jq \
            ca-certificates

      # 直接编译【上游源码】（main 分支，与官方 Docker 镜像同源）。
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: yym68686/uni-api
          ref: main
          path: upstream

      # 版本号取上游 Cargo.toml 的 version（形如 0.1.112）。
      # 说明：上游 latest release 是 Python 版的 v1.7.x，与 Rust 代码无关；
      # Rust 版从未发过 release，官方 Docker 镜像同样使用 Cargo.toml 版本号。
      - name: Resolve version from upstream Cargo.toml
        id: upstream
        run: |
          VERSION=$(grep -m1 '^version = ' upstream/Cargo.toml | cut -d'"' -f2)
          if [ -z "$VERSION" ]; then
            echo "::error::无法从 upstream/Cargo.toml 读取版本号"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "上游 Rust 版本: v$VERSION"

      - name: Show toolchain and upstream commit
        id: upcommit
        run: |
          rustc --version
          cargo --version
          echo "host target: $(rustc -vV | grep host)"
          SHA=$(cd upstream && git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "upstream commit: $SHA"
          cd upstream && git log -1 --format='%s'

      # 注意：不要在 Alpine 上加 RUSTFLAGS=-C target-feature=+crt-static。
      # 那会让 proc-macro（编译期 .so）也尝试静态链接而报错：
      #   cannot produce proc-macro for `async-trait` as the target does not support these crate types
      # Alpine 的 host target 本来就是 x86_64-unknown-linux-musl，直接编译即产出 musl 二进制。
      - name: Build
        working-directory: upstream
        run: |
          cargo build --release --locked
          strip target/release/uni-api-front || true
          echo "=== 产物 ==="
          ls -lh target/release/uni-api-front

      - name: Verify musl linkage
        working-directory: upstream
        run: |
          file target/release/uni-api-front || true
          echo "--- 依赖库（应显示 statically linked）---"
          ldd target/release/uni-api-front 2>&1 || true

      - name: Smoke test (non-blocking)
        continue-on-error: true
        working-directory: upstream
        run: |
          cat > api.yaml <<'EOF'
          providers:
            - provider: custom
              base_url: https://example.com/v1
              api: dummy
              model:
                - dummy-model
          api_keys:
            - api: test-key
          EOF
          ./target/release/uni-api-front &
          PID=$!
          sleep 6
          curl -sS -m 5 -o /dev/null -w "health_http=%{http_code}\n" http://127.0.0.1:8000/ || true
          kill $PID 2>/dev/null || true
          rm -f api.yaml

      - name: Package (fixed filename + sha256)
        id: pack
        run: |
          # 文件名固定不带版本号 —— 客户端可用永久地址：
          #   https://github.com/<owner>/<repo>/releases/latest/download/uni-api-linux-x86_64-musl
          NAME="uni-api-linux-x86_64-musl"
          cp upstream/target/release/uni-api-front "$NAME"
          chmod +x "$NAME"
          sha256sum "$NAME" > "${NAME}.sha256"
          ls -lh "$NAME" "${NAME}.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.upstream.outputs.tag }}
          name: ${{ steps.upstream.outputs.tag }} (musl x86_64)
          body: |
            Alpine / musl static build of the **uni-api core** (`uni-api-front`).

            - Version: `${{ steps.upstream.outputs.tag }}` (from upstream `Cargo.toml`)
            - Upstream commit: `${{ steps.upcommit.outputs.sha }}`
            - Source: `yym68686/uni-api` @ `main` (built directly from upstream, same source as the official Docker image)
            - Target: `x86_64-unknown-linux-musl`
            - Runs on any x86_64 Linux (Alpine, Debian, Ubuntu) — statically linked
            - Config: place `api.yaml` next to the binary, then run it

            **固定下载地址（永远指向最新版，客户端不用改）：**
            ```
            https://github.com/${{ github.repository }}/releases/latest/download/${{ steps.pack.outputs.name }}
            ```

            Verify: `sha256sum -c ${{ steps.pack.outputs.name }}.sha256`
          files: |
            ${{ steps.pack.outputs.name }}
            ${{ steps.pack.outputs.name }}.sha256
          overwrite_files: true
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: uni-api-front-linux-amd64-musl
          path: upstream/target/release/uni-api-front
          if-no-files-found: error
          retention-days: 30
